spring.application.name=mock-erp-service

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db,kafka

spring.datasource.url=${ERP_DATABASE_URL:jdbc:postgresql://localhost:5432/mock_erp}
spring.datasource.username=${PG_USERNAME:mock_erp}
spring.datasource.password=${PG_PASSWORD:mock_erp}
spring.jpa.hibernate.ddl-auto=validate

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.operation-timeout=${KAFKA_HEALTH_TIMEOUT:2s}

northstar.messaging.customer-sync.topic=${CUSTOMER_SYNC_TOPIC:northstar.customer-sync.v1}
northstar.messaging.customer-sync.group-id=${CUSTOMER_SYNC_CONSUMER_GROUP:northstar.mock-erp.v1}
northstar.messaging.customer-sync.listener-enabled=${CUSTOMER_SYNC_LISTENER_ENABLED:false}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.northstar.mockerp.messaging.customer.CustomerSyncRequestedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.northstar.mockerp.messaging.customer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

northstar.messaging.customer-sync.max-attempts=${CUSTOMER_SYNC_MAX_ATTEMPTS:3}
northstar.messaging.customer-sync.retry-backoff=${CUSTOMER_SYNC_RETRY_BACKOFF:1s}
northstar.messaging.customer-sync.dead-letter-suffix=${CUSTOMER_SYNC_DEAD_LETTER_SUFFIX:.DLT}
